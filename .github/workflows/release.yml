# Builds the `pki` binary for every supported platform.
#
# * pull requests and manual runs: build every target (a check, nothing is published).
# * a `v*` tag: build, package, attest and publish a GitHub release.
#
# | Platform              | Rust target                      | Packages                 |
# |-----------------------|----------------------------------|--------------------------|
# | Linux x86-64 (amd64)  | x86_64-unknown-linux-musl        | .tar.gz, .deb, .rpm      |
# | Linux x86 (32-bit)    | i686-unknown-linux-musl          | .tar.gz, .deb, .rpm      |
# | Linux ARM 64-bit      | aarch64-unknown-linux-musl       | .tar.gz, .deb, .rpm      |
# | Linux ARM 32-bit (v7) | armv7-unknown-linux-musleabihf   | .tar.gz, .deb, .rpm      |
# | Windows x86-64        | x86_64-pc-windows-msvc           | .zip                     |
# | macOS Apple silicon   | aarch64-apple-darwin             | .tar.gz                  |
#
# Linux binaries are static (musl), so one file runs on every distribution.
name: Release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Tested with cargo-zigbuild 0.24 on 2026-11-26.
  ZIGLANG_VERSION: "0.17.1"

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl,      os: ubuntu-latest,  deb: amd64, rpm: x86_64 }
          - { target: i686-unknown-linux-musl,        os: ubuntu-latest,  deb: i386,  rpm: i686 }
          - { target: aarch64-unknown-linux-musl,     os: ubuntu-latest,  deb: arm64, rpm: aarch64 }
          - { target: armv7-unknown-linux-musleabihf, os: ubuntu-latest,  deb: armhf, rpm: armv7hl }
          - { target: x86_64-pc-windows-msvc,         os: windows-latest }
          - { target: aarch64-apple-darwin,           os: macos-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}

      - name: Install the Linux cross tools
        if: runner.os == 'Linux'
        run: |
          python3 -m pip install --user "ziglang==${ZIGLANG_VERSION}"
      - uses: taiki-e/install-action@893d6ee8d714b6c7dfe2bcd94e5759e9a7958a7e # v2.90.10
        if: runner.os == 'Linux'
        with:
          tool: cargo-zigbuild,cargo-deb,cargo-generate-rpm

      - name: Build (Linux, static musl)
        if: runner.os == 'Linux'
        run: cargo zigbuild --release --locked --target ${{ matrix.target }}

      - name: Build (Windows, static CRT)
        if: runner.os == 'Windows'
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Smoke test
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          bin="target/${TARGET}/release/pki"
          case "$TARGET" in
            aarch64-unknown-linux-musl|armv7-*)
              # No ARM runner needed: run the static binary under QEMU user mode.
              qemu=$([[ "$TARGET" == aarch64* ]] && echo qemu-aarch64 || echo qemu-arm)
              docker run --rm -v "$PWD/$bin:/pki:ro" alpine:3.22 \
                sh -c "apk add -q $qemu >/dev/null && $qemu /pki --version && $qemu /pki --help >/dev/null"
              ;;
            *windows*) "$bin.exe" --version && "$bin.exe" --help > /dev/null ;;
            *) "$bin" --version && "$bin" --help > /dev/null ;;
          esac

      - name: Package
        id: package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          DEB_ARCH: ${{ matrix.deb }}
          RPM_ARCH: ${{ matrix.rpm }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          name="pki-cli-${version}-${TARGET}"
          mkdir -p dist "staging/${name}"
          cp README.md LICENSE "staging/${name}/"
          if [[ "$TARGET" == *windows* ]]; then
            cp "target/${TARGET}/release/pki.exe" "staging/${name}/"
            (cd staging && 7z a -tzip "../dist/${name}.zip" "${name}" > /dev/null)
          else
            cp "target/${TARGET}/release/pki" "staging/${name}/"
            tar -C staging -czf "dist/${name}.tar.gz" "${name}"
          fi
          if [[ -n "${DEB_ARCH:-}" ]]; then
            cargo deb --no-build --no-strip --target "$TARGET" \
              --output "dist/pki-cli_${version}_${DEB_ARCH}.deb"
            cargo generate-rpm --target "$TARGET" --arch "$RPM_ARCH" \
              --output "dist/pki-cli-${version}-1.${RPM_ARCH}.rpm"
          fi
          ls -l dist

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish the GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Check that the tag matches Cargo.toml
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          test "v${version}" = "$REF_NAME" || { echo "tag $REF_NAME != Cargo.toml $version"; exit 1; }

      - name: Checksums
        run: cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS

      - uses: actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184180e6d0018 # v1.4.4
        with:
          subject-path: dist/*

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: dist/*
          fail_on_unmatched_files: true
